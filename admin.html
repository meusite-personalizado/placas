<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador e Controle de Placas</title>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Gerador de QR Code em SVG/Canvas no navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 24px;
      color: #1e293b;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }
    h1 { font-size: 1.4rem; margin-top: 0; }
    h2 { font-size: 1.1rem; margin-top: 0; color: #475569; }
    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    input {
      border: 1px solid #cbd5e1;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button.secondary {
      background: #0f172a;
    }
    button.secondary:hover { background: #334155; }
    .qrcode-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
    }
    #qrcode {
      padding: 12px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge-virgin { background: #fef3c7; color: #92400e; }
    .badge-active { background: #dcfce7; color: #166534; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.85rem;
    }
    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #f1f5f9;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- LOGIN COM SENHA MESTRA -->
  <div class="card" id="login-section">
    <h1>Controle de Fabricação</h1>
    <p style="color: #64748b; font-size: 0.9rem;">Digite a senha mestra para acessar o criador de placas.</p>
    <input type="password" id="admin-pass" placeholder="Senha mestra (ex: 1234)">
    <button onclick="fazerLogin()">Acessar Painel</button>
  </div>

  <!-- PAINEL PRINCIPAL -->
  <div id="painel-section" style="display: none;">
    <div class="card">
      <h2>Gerar Nova Plaquinha</h2>
      <p style="font-size: 0.9rem; color: #64748b;">
        Próximo ID livre sugerido: <strong id="next-id-label" style="color: #2563eb; font-size: 1.1rem;">Buscando...</strong>
      </p>

      <input type="text" id="target-id" placeholder="ID da placa (ex: 011)">
      <button onclick="gerarECadastrarPlaca()">Gerar QR Code e Cadastrar Placa</button>

      <div class="qrcode-wrapper" id="qr-result" style="display: none;">
        <div id="qrcode"></div>
        <p id="qr-url-text" style="font-size: 0.8rem; color: #64748b; word-break: break-all; text-align: center; margin: 10px 0;"></p>
        <button class="secondary" onclick="baixarQRCode()">Baixar Imagem do QR Code (PNG)</button>
      </div>
    </div>

    <!-- LISTA DE PLACAS JÁ CADASTRADAS -->
    <div class="card">
      <h2>Placas no Sistema</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Status</th>
            <th>Destino</th>
          </tr>
        </thead>
        <tbody id="placas-tbody">
          <tr><td colspan="3">Carregando placas...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://gkchkzzaibcdosofyfqc.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrY2hrenphaWJjZG9zb2Z5ZnFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODk0ODgsImV4cCI6MjEwNDQ2NTQ4OH0.9sDK1nePRca_T6snNoQQQGI23yCdvEoMEYIhpw_Jg48';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const SENHA_MESTRA = '1234';
  let qrCodeObj = null;

  function fazerLogin() {
    const pass = document.getElementById('admin-pass').value;
    if (pass === SENHA_MESTRA) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('painel-section').style.display = 'block';
      carregarDados();
    } else {
      alert('Senha incorreta!');
    }
  }

  async function carregarDados() {
    const { data: placas, error } = await _supabase
      .from('placas')
      .select('*');

    if (error) {
      alert('Erro ao carregar placas do Supabase');
      return;
    }

    // 1. Identifica os IDs numéricos existentes
    const idsUsados = new Set();
    placas.forEach(p => {
      const num = parseInt(p.id, 10);
      if (!isNaN(num)) idsUsados.add(num);
    });

    // 2. Acha o primeiro número disponível a partir de 1
    let proximoNum = 1;
    while (idsUsados.has(proximoNum)) {
      proximoNum++;
    }

    // Formata em 3 dígitos (ex: 011)
    const proximoIdFormatado = String(proximoNum).padStart(3, '0');
    document.getElementById('next-id-label').innerText = proximoIdFormatado;
    document.getElementById('target-id').value = proximoIdFormatado;

    // 3. Monta a listagem na tabela
    const tbody = document.getElementById('placas-tbody');
    tbody.innerHTML = '';

    // Ordena do maior ID para o menor
    placas.sort((a, b) => parseInt(b.id || 0) - parseInt(a.id || 0));

    placas.forEach(p => {
      const tr = document.createElement('tr');
      const isAtiva = p.link_google && p.link_google.trim() !== '';
      tr.innerHTML = `
        <td><strong>${p.id}</strong></td>
        <td>
          <span class="badge ${isAtiva ? 'badge-active' : 'badge-virgin'}">
            ${isAtiva ? 'Ativada' : 'Virgem'}
          </span>
        </td>
        <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
          ${isAtiva ? `<a href="${p.link_google}" target="_blank">${p.link_google}</a>` : '—'}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function gerarECadastrarPlaca() {
    const idEscolhido = document.getElementById('target-id').value.trim();
    if (!idEscolhido) {
      alert('Digite ou confirme um ID!');
      return;
    }

    // URL final que vai ser gravada na plaquinha de acrílico
    const baseUrl = window.location.origin + window.location.pathname.replace('admin.html', '');
    const urlPlaca = `${baseUrl}?id=${idEscolhido}`;

    // Cadastra a placa virgem no Supabase caso não exista
    const { error } = await _supabase
      .from('placas')
      .upsert({
        id: idEscolhido,
        senha: SENHA_MESTRA
      }, { onConflict: 'id', ignoreDuplicates: true });

    if (error) {
      alert('Erro ao reservar o ID no Supabase: ' + error.message);
      return;
    }

    // Renderiza o QR Code na tela
    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = '';
    qrCodeObj = new QRCode(qrContainer, {
      text: urlPlaca,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.H // Alta precisão para corte/impressão
    });

    document.getElementById('qr-url-text').innerText = urlPlaca;
    document.getElementById('qr-result').style.display = 'flex';

    // Atualiza a tabela
    carregarDados();
  }

  function baixarQRCode() {
    const img = document.querySelector('#qrcode img');
    const idEscolhido = document.getElementById('target-id').value.trim();
    if (img && img.src) {
      const a = document.createElement('a');
      a.href = img.src;
      a.download = `qrcode-placa-${idEscolhido}.png`;
      a.click();
    } else {
      // Caso seja renderizado em Canvas
      const canvas = document.querySelector('#qrcode canvas');
      if (canvas) {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `qrcode-placa-${idEscolhido}.png`;
        a.click();
      }
    }
  }
</script>
</body>
</html>
